name: opentutor
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: opentutor
      POSTGRES_PASSWORD: opentutor
      POSTGRES_DB: opentutor
    ports: ["127.0.0.1:54329:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opentutor"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports: ["127.0.0.1:6389:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres-data:
  redis-data:
